# The station release channel's nightly promotion (issue #113), the Aviary's
# promote-stations.yml by way of the Quarry's, with the Conservatory's names.
#
# conservatory-station-stable is the branch every remote station's
# conservatory-autodeploy watcher follows (CONSERVATORY_DEPLOY_BRANCH in
# /etc/conservatory/conservatory.env). It is NOT a fork: fast-forward-only,
# never committed to directly, always an ancestor of main -- main with a
# delay. This job moves it to main's tip once nightly, so a house two hours
# away builds while everyone sleeps and a station absorbs at most one day of
# changes per deploy.
#
# Runs HERE, not on a box, on purpose: promotion is a push, and no box holds a
# write credential of any kind (the watcher pulls over anonymous https). The
# GITHUB_TOKEN this job uses is minted per run, repo-scoped, and gone when the
# job ends.
#
# --ff-only is the tripwire: if the branch can't fast-forward, something
# committed to it directly, and this job FAILS LOUDLY (red run + email) rather
# than papering over it. Fix the branch; never force.
#
# The emergency path (a fix can't wait for tonight): merge the fix to main,
# then run this workflow by hand -- Actions -> "Promote stations" -> Run
# workflow (the GitHub phone app works), or:
#   gh workflow run promote-stations.yml
# The station watchers deploy within a minute of the fast-forward.
#
# The branch is created once, by hand, from main's tip:
#   git fetch origin && git push origin origin/main:refs/heads/conservatory-station-stable

name: Promote stations

on:
  schedule:
    # Actions cron is UTC only: 07:40 UTC = 02:40 EST / 03:40 EDT -- the small
    # hours at every house year-round. Forty minutes after the Aviary's 07:00
    # and twenty after the Quarry's 07:20, so no two builds start in the same
    # minute on a J5005.
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-stations

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # Full history: a shallow clone can't prove ancestry for --ff-only.
      # This step also fails loudly if conservatory-station-stable doesn't exist.
      - uses: actions/checkout@v4
        with:
          ref: conservatory-station-stable
          fetch-depth: 0
      - name: Fast-forward conservatory-station-stable to main
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          git push origin conservatory-station-stable
