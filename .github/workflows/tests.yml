name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # Node 24: the web app reads SQLite through node:sqlite, the stdlib
      # module, which is unflagged from 22.13 on; 24 is what the dev machine
      # and the boxes run.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # THIS LIST IS THE WHOLE CONTRACT (the Aviary's rule): there is no
      # pytest.ini/testpaths fallback, so a test_*.py that isn't named here
      # silently never runs. Add new files by hand.
      - run: pip install pytest requests pillow
      - run: pytest test_fern_db.py test_fern_plantnet.py test_fern_queue.py test_fern_enrich.py test_fern_care.py -q
